name: Catalogue health
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-health
  cancel-in-progress: false
jobs:
  catalogue-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails (and notifies) when too few listings are visible to seekers, so an empty catalogue is never silent.
      - run: npm run seed:check -- --min-visible 10 --out recheck-queue.json
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recheck-queue
          path: recheck-queue.json
          if-no-files-found: ignore
